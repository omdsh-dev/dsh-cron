name: release-check

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Exact current main commit to validate
        required: true
        type: string
      version:
        description: Package version without a v prefix
        required: true
        type: string
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-check-${{ github.ref }}-${{ inputs.ref || github.sha }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24 runtime
        with:
          ref: ${{ inputs.ref || github.ref_name }}
          fetch-depth: 0
      - name: Fetch authoritative main
        run: git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10, Node 24 runtime
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0, Node 24 runtime
        with:
          node-version: 24
          cache: pnpm
      - name: Verify release identity
        env:
          RELEASE_REF: ${{ inputs.ref || github.ref_name }}
          RELEASE_VERSION: ${{ inputs.version || github.ref_name }}
        run: node scripts/verify-release.mjs --ref "$RELEASE_REF" --version "$RELEASE_VERSION"
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm run verify:self-contained
      - run: pnpm run typecheck
      - run: pnpm test
      - run: pnpm run build
      - run: pnpm run prepare
      - run: pnpm pack --dry-run
      - run: node --input-type=module -e "import('./lib/index.js').then((m) => { if (m.default || m.name !== 'dsh-cron') process.exit(1) })"
      - name: Verify exact Git installation
        env:
          INSTALL_REF: ${{ inputs.ref || github.ref_name }}
        run: node scripts/git-install-smoke.mjs --ref "$INSTALL_REF"
      - name: Verify tracked files remain clean
        run: test -z "$(git status --porcelain)"
