# Bundle patch applied over the selected DSH profile when this package is listed
# in `dsh.profile.bundles`. The row id is deployment-local; the package name
# must match package.json. In web profiles this same row also contributes the
# browser task center declared by the package's `dsh.client` manifest.

- insert:
    - id: dsh-cron
      name: dsh-cron
      # config:
      #   dataDir: <string>            # job store directory; defaults to $DSH_HOME/cron
      #   defaultTimeZone: <string>    # IANA zone for schedules; defaults to the host local zone
      #   maxJobs: 64                  # maximum active jobs
      #   minIntervalMinutes: 1        # minimum gap between recurring fires
      #   defaultCwd: <absolute-workspace> # required for browser/API jobs without an explicit target
      #   reconcilePollMs: 1000        # durable Automation event-feed polling interval
      #   maxRunHistory: 100           # retained source occurrences per job

# No invariant companion row: the shipped web/headless profiles do not compose
# the `invariants` service, so an invariant row would never resolve there.
